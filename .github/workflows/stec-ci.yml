name: STEC Quality Gates

on:
  push:
    branches: [main, 'upgrade/**', 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stec-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Static release policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify native encryption and Android hardening policy
        run: bash scripts/check_release_policy.sh

  ui:
    name: UI quality and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:production

  core:
    name: Rust formatting, linting, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run native tests
        run: cargo test --workspace --all-targets --locked

  android-core:
    name: Android ARM64 core build
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: core
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build workspace for Android ARM64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --release --workspace --locked

  android-app:
    name: Android application build and release checks
    runs-on: ubuntu-latest
    needs: [ui, release-policy]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.3.11579264'

      - name: Install locked UI dependencies and synchronize Android assets
        working-directory: ui
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Re-verify generated Android release policy
        run: bash scripts/check_release_policy.sh

      - name: Assemble debug and unsigned release APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Generate non-sensitive artifact provenance
        run: bash scripts/generate_release_metadata.sh

      - name: Generate JavaScript license inventory
        run: node scripts/generate_js_license_inventory.mjs

      - name: Generate CycloneDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: stec-sbom-${{ github.sha }}
          output-file: stec-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Upload APKs and release metadata
        uses: actions/upload-artifact@v4
        with:
          name: stec-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*-unsigned.apk
            android/app/build/outputs/mapping/release/
            android/app/build/outputs/RELEASE_METADATA.txt
            android/app/build/outputs/JS_LICENSE_INVENTORY.json
